[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uptime-lite"
version = "0.0.1"
description = "Self-hosted uptime monitor with debounced incident detection and a static public status page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed-Taqy Salmi" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://mohamedtaqysalmi.github.io/uptime-lite/"
Repository = "https://github.com/mohamedtaqysalmi/uptime-lite"
Changelog = "https://github.com/mohamedtaqysalmi/uptime-lite/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/uptime_lite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=uptime_lite --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["uptime_lite"]

[tool.coverage.report]
fail_under = 85
show_missing = true
