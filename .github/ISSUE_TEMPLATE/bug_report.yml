name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal config and the commands you ran. Remove secrets such as bot tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: uptime-lite version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
